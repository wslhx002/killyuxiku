name: smoke-test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run on emulator, screenshot and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.voxelsandbox/.MainActivity || true
            sleep 45
            adb exec-out screencap -p > shot_day.png || true
            # 旋转视角制造不同画面
            adb shell input swipe 600 400 300 400 300 || true
            sleep 2
            adb exec-out screencap -p > shot_2.png || true
            echo "================= CRASH / APP LOGCAT ================="
            adb logcat -d -v threadtime | grep -iE "VoxelCrash|FATAL EXCEPTION|E/AndroidRuntime|Displayed com.voxelsandbox|GLES|Shader" || true
            echo "================= SCREENSHOT SIZE ================="
            ls -l shot_day.png shot_2.png || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot_*.png
          if-no-files-found: warn
