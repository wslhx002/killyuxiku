plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voxelsandbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.voxelsandbox"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
